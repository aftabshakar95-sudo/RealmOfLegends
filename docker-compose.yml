version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Your_password123"
      POSTGRES_DB: RealmOfLegendsDb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RealmOfLegendsDb -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=RealmOfLegendsDb;Username=postgres;Password=Your_password123
      - DB_PROVIDER=Postgres
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
